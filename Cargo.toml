[package]
name = "codebase-memory-rlm-mcp"
version = "0.1.0"
edition = "2021"
description = "codebase-memory-rlm-mcp — standalone Rust RLM MCP server (external context sessions)"
license = "MIT"
authors = ["RLM Contributors"]
keywords = ["mcp", "rlm", "codebase", "codebase-memory-rlm-mcp"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "codebase_memory_rlm_mcp"
path = "src/lib.rs"

[[bin]]
name = "codebase-memory-rlm-mcp"
path = "src/main.rs"

[dependencies]
dirs = "6"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1